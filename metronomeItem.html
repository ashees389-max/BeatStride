<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030810">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BeatStride — Select Mode (Native Scroll)</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      overflow:hidden;
      background:#030810;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Stage ── */
    .stage {
      width:100%; height:100vh; height:100svh;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .content-group {
      position:relative; z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      margin-bottom: clamp(8px, 2vh, 20px); margin-bottom: clamp(8px, 2svh, 20px);
    }

    /* ── Deep space background ── */
    .stage::before {
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,    rgba(10,18,70,0.7)  0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 10% 80%,   rgba(6,12,48,0.5)   0%, transparent 60%),
        radial-gradient(ellipse 50% 35% at 88% 55%,   rgba(8,16,58,0.4)   0%, transparent 58%),
        radial-gradient(ellipse 100% 90% at 50% 50%,  rgba(3,6,24,0.85)   0%, transparent 100%);
      pointer-events:none; z-index:0;
    }

    #canvas { position:absolute; inset:0; pointer-events:none; z-index:1; }

    .orbit-ring {
      position:absolute;
      width: min(88vw, 520px);
      height: min(88vw, 520px);
      border-radius:50%;
      border: 1px solid rgba(255,255,255,0.045);
      box-shadow: 0 0 40px rgba(255,255,255,0.015);
      pointer-events:none; z-index:2;
      animation: orbitBreath 8s ease-in-out infinite;
    }
    @keyframes orbitBreath {
      0%,100%{ transform:scale(1);   opacity:0.6; }
      50%    { transform:scale(1.02); opacity:1;   }
    }

    .app-label {
      position:relative; z-index:10;
      color: rgba(255,255,255,0.55);
      font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
      font-size:0.55rem;
      letter-spacing:6px;
      text-transform:uppercase;
      margin-bottom: clamp(8px,1.8vh,16px); margin-bottom: clamp(8px,1.8svh,16px);
      animation: fadeUp 1s 0.1s ease both;
    }

    /* ── Orbit wrap — positioning context for the scroller + edge fades ── */
    .orbit-wrap {
      position:relative; z-index:10;
      width:100vw;
      height: clamp(270px, 54vh, 390px); height: clamp(270px, 54svh, 390px);
    }

    /* ── Orbit viewport — NATIVE horizontal scroll-snap container ──
       The slide and the release physics are now owned by the browser's native
       scroller, which runs on the OS compositor thread — smooth even on weak
       devices where a JS-driven transform would stall. */
    .orbit-viewport {
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      gap: 24px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;   /* don't let overscroll bubble to the page */
      -webkit-overflow-scrolling: touch; /* momentum scrolling on iOS WebView */
      padding-top: 8px;                  /* headroom for the active card's float */
      /* hide the scrollbar on every engine */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .orbit-viewport::-webkit-scrollbar { display:none; }

    /* While the finger (or a smooth-scroll) is moving the scroller, strip the
       three per-frame GPU costs. backdrop-filter re-samples the moving starfield
       every frame — the single worst-case killer — and the inactive card's blur
       re-rasterizes as it scales. Restored ~140ms after scrolling stops. */
    .orbit-viewport.is-scrolling .planet {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter: none !important;
    }

    /* ── Edge fades — painted OVER the scroller (not a mask on it) so the
       scrolling content never has to render into an offscreen buffer. ── */
    .edge-fade {
      position:absolute; top:0; bottom:0;
      width:16%;
      pointer-events:none;
      z-index:11;
    }
    .edge-left  { left:0;  background:linear-gradient(to right, #030810 0%, rgba(3,8,16,0) 100%); }
    .edge-right { right:0; background:linear-gradient(to left,  #030810 0%, rgba(3,8,16,0) 100%); }

    /* ── Individual planet card ── */
    .planet {
      position:relative;
      flex-shrink:0;
      scroll-snap-align: center;   /* each card snaps to the scroller's centre */
      width:  clamp(200px, 54vw, 320px);
      height: clamp(265px, 52vh, 380px); height: clamp(265px, 52svh, 380px);
      border-radius: clamp(24px,6vw,36px);
      text-decoration:none;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding: clamp(20px,4vw,28px);
      overflow:hidden;
      /* Scale + opacity are driven continuously from the scroll position in JS
         (see updateScales) so the card grows AS it approaches centre and tracks
         the finger — no hold-then-pop. Deliberately NO transition here: a
         transition would lag behind the finger; the per-frame scroll update is
         what makes it smooth. */
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    /* is-active / is-inactive now carry only state that ISN'T size/opacity
       (those are set continuously by JS). Kept here: the rest-blur on the off
       card, tap targets, and the active glow + CTA via selectors elsewhere. */
    .planet.is-active   { pointer-events:all; }
    .planet.is-inactive { filter: blur(2.5px); pointer-events:all; }

    /* ── Athletic planet — Mars warmth ── */
    .planet-athletic {
      background:
        radial-gradient(ellipse 90% 60% at 40% 20%,
          rgba(180,70,40,0.18) 0%, transparent 60%),
        linear-gradient(155deg,
          rgba(255,255,255,0.095) 0%,
          rgba(255,255,255,0.040) 50%,
          rgba(255,255,255,0.012) 100%);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.16),
        inset 0 -1px  0 rgba(255,255,255,0.03),
        0 0 0 0.5px rgba(255,255,255,0.04),
        0 40px 80px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
    }
    .planet-athletic.is-active {
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.18),
        inset 0 -1px  0 rgba(255,255,255,0.03),
        0 0 0 0.5px rgba(210,90,60,0.15),
        0 40px 80px rgba(0,0,0,0.65),
        0 0 60px rgba(200,70,40,0.10),
        0 0 120px rgba(180,50,20,0.06);
    }

    /* ── Music planet — Neptune cool ── */
    .planet-music {
      background:
        radial-gradient(ellipse 90% 60% at 60% 20%,
          rgba(50,80,200,0.18) 0%, transparent 60%),
        linear-gradient(155deg,
          rgba(255,255,255,0.095) 0%,
          rgba(255,255,255,0.040) 50%,
          rgba(255,255,255,0.012) 100%);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.16),
        inset 0 -1px  0 rgba(255,255,255,0.03),
        0 0 0 0.5px rgba(255,255,255,0.04),
        0 40px 80px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
    }
    .planet-music.is-active {
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.18),
        inset 0 -1px  0 rgba(255,255,255,0.03),
        0 0 0 0.5px rgba(70,100,220,0.15),
        0 40px 80px rgba(0,0,0,0.65),
        0 0 60px rgba(50,80,200,0.10),
        0 0 120px rgba(30,60,180,0.06);
      border-color: rgba(255,255,255,0.10);
    }

    .planet-bg { position:absolute; top:0; right:0; width:62%; height:65%; pointer-events:none; opacity:0.075; }

    .planet-glow {
      position:absolute; top:-30%; left:-20%;
      width:100%; height:80%; border-radius:50%;
      pointer-events:none; transition: opacity 0.34s ease;
    }
    .planet-athletic .planet-glow { background: radial-gradient(ellipse at 40% 50%, rgba(220,85,50,0.12) 0%, transparent 65%); }
    .planet-music    .planet-glow { background: radial-gradient(ellipse at 60% 50%, rgba(60,100,220,0.12) 0%, transparent 65%); }

    .planet-tag {
      font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
      font-size:0.54rem; letter-spacing:4px;
      color:rgba(255,255,255,0.32); text-transform:uppercase;
      margin-bottom:8px; position:relative; z-index:2;
    }
    .planet-name {
      color:#ffffff; font-size: clamp(2.2rem, 7vw, 3rem); font-weight:700;
      letter-spacing:-0.5px; line-height:1; position:relative; z-index:2;
      text-shadow:0 2px 8px rgba(0,0,0,0.45); margin-bottom:12px;
    }
    .planet-features {
      display:flex; flex-direction:column; gap:5px;
      position:relative; z-index:2; margin-bottom:4px; padding-right: 44px;
    }
    .planet-feature {
      font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
      font-size:0.6rem; letter-spacing:1.5px; color:rgba(255,255,255,0.26);
      text-transform:uppercase; display:flex; align-items:flex-start; gap:7px;
      line-height:1.4; white-space:normal; word-break:break-word;
    }
    .planet-feature::before {
      content:""; width:3px; height:3px; border-radius:50%;
      background:rgba(255,255,255,0.28); flex-shrink:0; margin-top:4px;
    }

    .planet-cta {
      position:absolute; bottom:18px; right:18px; z-index:2;
      width:30px; height:30px; border-radius:50%;
      background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
      display:flex;align-items:center;justify-content:center;
      color:rgba(255,255,255,0.6); font-size:0.8rem; transition: opacity 0.3s;
    }
    .planet.is-inactive .planet-cta { opacity:0; }

    /* ── Navigation arrows ── */
    .nav-row {
      position:relative; z-index:10;
      display:flex; align-items:center;
      gap: clamp(28px,10vw,56px);
      margin-top: clamp(14px,3vh,28px); margin-top: clamp(14px,3svh,28px);
      animation: fadeUp 0.7s 0.5s ease both;
    }
    .nav-btn {
      width:38px; height:38px; border-radius:50%;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10);
      display:flex;align-items:center;justify-content:center; cursor:pointer;
      color:rgba(255,255,255,0.45); font-size:1rem;
      transition:background 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color:transparent; user-select:none;
    }
    .nav-btn:active { background:rgba(255,255,255,0.14); }
    .nav-btn.hidden { opacity:0; pointer-events:none; }
    @media(hover:hover){ .nav-btn:hover { background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.8); } }

    .nav-dots { display:flex; gap:8px; align-items:center; }
    .nav-dot {
      width:5px; height:5px; border-radius:50%;
      background:rgba(255,255,255,0.2); transition: background 0.35s, transform 0.35s;
    }
    .nav-dot.active { background:rgba(255,255,255,0.75); transform:scale(1.3); }

    .dash-link {
      position:relative; z-index:10; margin-top: clamp(12px,2.5vh,22px); margin-top: clamp(12px,2.5svh,22px);
      color:rgba(255,255,255,0.45);
      font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
      font-size:0.56rem; letter-spacing:3px; text-transform:uppercase;
      text-decoration:none; transition:color 0.2s;
      animation: fadeUp 0.7s 0.7s ease both;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .stage.out { animation: stageOut 0.42s ease forwards; }
    @keyframes stageOut { to { opacity:0; } }

    /* Floating motion on the active card (delayed so it never fights the
       scale-in transition). */
    .planet.is-active { animation: planetFloat 7s ease-in-out 0.4s infinite; }
    /* Float uses the individual `translate` property (not `transform`) so it
       composes with the JS-set `transform: scale()` instead of overwriting it.
       Old WebViews without `translate` simply skip the bob — no conflict. */
    @keyframes planetFloat {
      0%,100%{ translate: 0 0; }
      50%    { translate: 0 -6px; }
    }
    .planet.is-inactive { animation:none; }

    @media(max-height:500px){
      .content-group { margin-bottom:0; }
      .orbit-wrap { height:clamp(200px,48vh,250px); height:clamp(200px,48svh,250px); }
      .planet { height:clamp(190px,44vh,240px); height:clamp(190px,44svh,240px); }
      .planet-name { font-size:1.8rem; margin-bottom:6px; }
      .planet-features { gap:2px; }
      .planet-feature { font-size:0.52rem; }
      .app-label { margin-bottom:8px; }
      .nav-row { margin-top:8px; }
      .dash-link { margin-top:6px; }
    }
    @media(max-width:350px){
      .planet { width:clamp(180px,52vw,210px); padding: clamp(16px,4vw,20px); }
      .planet-name { font-size:1.9rem; }
      .planet-features { padding-right:36px; }
      .planet-feature { font-size:0.54rem; letter-spacing:1px; }
    }
  </style>
</head>
<body>

<div class="stage" id="stage">

  <canvas id="canvas"></canvas>
  <div class="orbit-ring"></div>

  <div class="content-group">

  <p class="app-label">Select your mode</p>

  <div class="orbit-wrap">
    <div class="orbit-viewport" id="orbitViewport">

      <!-- ATHLETIC -->
      <div class="planet planet-athletic is-active" id="planetA" data-mode="athletic">
        <div class="planet-glow"></div>
        <svg class="planet-bg" viewBox="0 0 240 200" preserveAspectRatio="xMidYMid meet">
          <path fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
            d="M0,100 L24,100 L34,46 L44,154 L54,100 L82,100 L92,42 L102,158 L112,100
               L140,100 L150,48 L160,152 L170,100 L198,100 L208,44 L218,156 L228,100 L240,100"/>
          <path fill="none" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.4"
            d="M0,100 L20,100 L28,66 L36,134 L44,100 L66,100 L74,60 L82,140 L90,100
               L112,100 L120,64 L128,136 L136,100 L158,100 L166,62 L174,138 L182,100
               L204,100 L212,60 L220,140 L228,100 L240,100"/>
        </svg>
        <span class="planet-tag">Athletic Mode</span>
        <h2 class="planet-name">Athletic</h2>
        <div class="planet-features">
          <span class="planet-feature">Cadence training</span>
          <span class="planet-feature">Interval sets &amp; rest timer</span>
          <span class="planet-feature">Cadence ramp</span>
        </div>
        <div class="planet-cta">→</div>
      </div>

      <!-- MUSIC -->
      <div class="planet planet-music is-inactive" id="planetM" data-mode="music">
        <div class="planet-glow"></div>
        <svg class="planet-bg" viewBox="0 0 240 200" preserveAspectRatio="xMidYMid meet">
          <path fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"
            d="M0,100 Q20,54 40,100 Q60,146 80,100 Q100,54 120,100 Q140,146 160,100
               Q180,54 200,100 Q220,146 240,100"/>
          <path fill="none" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.38"
            d="M0,100 Q16,70 32,100 Q48,130 64,100 Q80,70 96,100 Q112,130 128,100
               Q144,70 160,100 Q176,130 192,100 Q208,70 224,100"/>
          <line x1="0" y1="72"  x2="240" y2="72"  stroke="white" stroke-width="0.5" opacity="0.15"/>
          <line x1="0" y1="84"  x2="240" y2="84"  stroke="white" stroke-width="0.5" opacity="0.15"/>
          <line x1="0" y1="96"  x2="240" y2="96"  stroke="white" stroke-width="0.5" opacity="0.15"/>
          <line x1="0" y1="108" x2="240" y2="108" stroke="white" stroke-width="0.5" opacity="0.15"/>
          <line x1="0" y1="120" x2="240" y2="120" stroke="white" stroke-width="0.5" opacity="0.15"/>
        </svg>
        <span class="planet-tag">Music Mode</span>
        <h2 class="planet-name">Music</h2>
        <div class="planet-features">
          <span class="planet-feature">18 instruments</span>
          <span class="planet-feature">5 practice modes</span>
          <span class="planet-feature">Subdivisions &amp; accents</span>
        </div>
        <div class="planet-cta">→</div>
      </div>

    </div><!-- /orbit-viewport -->

    <div class="edge-fade edge-left"></div>
    <div class="edge-fade edge-right"></div>
  </div><!-- /orbit-wrap -->

  <div class="nav-row">
    <div class="nav-btn hidden" id="navLeft">‹</div>
    <div class="nav-dots">
      <div class="nav-dot active" id="dotA"></div>
      <div class="nav-dot"        id="dotM"></div>
    </div>
    <div class="nav-btn" id="navRight">›</div>
  </div>

  <a href="dashboard.html" class="dash-link">My Progress →</a>

  </div><!-- /content-group -->

</div><!-- /stage -->

<script>
// Shared with the starfield: true while the scroller is moving, so the starfield
// pauses its redraw and hands the main thread to the (native) scroll.
let motionActive = false;

// ═══════════════════════════════════════════════════════════
//  STAR FIELD
// ═══════════════════════════════════════════════════════════
(function(){
  const cv=document.getElementById("canvas");
  const ctx=cv.getContext("2d");
  let W,H,small=[],bright=[];

  function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    build();
  }

  function build(){
    const n=Math.floor((W*H)/5800);
    small=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*0.7+0.15,
      a:Math.random()*0.45+0.08,
      da:(Math.random()*0.005+0.002)*(Math.random()<0.5?1:-1),
      dx:(Math.random()*0.07+0.02)*(Math.random()<0.5?1:-1),
    }));
    bright=Array.from({length:7},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*0.9+1.1,
      a:Math.random()*0.3+0.5,
      da:(Math.random()*0.007+0.003)*(Math.random()<0.5?1:-1),
      dx:(Math.random()*0.04+0.01)*(Math.random()<0.5?1:-1),
      glow:0,
    }));
    bright.forEach(s=>s.glow=s.r*5.5);
  }

  function draw(){
    requestAnimationFrame(draw);
    if(motionActive) return; // paused while the scroller is moving
    ctx.clearRect(0,0,W,H);
    for(const s of small){
      s.a+=s.da; if(s.a>0.53||s.a<0.06)s.da*=-1;
      s.x+=s.dx; if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.a.toFixed(3)})`; ctx.fill();
    }
    for(const s of bright){
      s.a+=s.da; if(s.a>0.85||s.a<0.42)s.da*=-1;
      s.x+=s.dx; if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.glow);
      g.addColorStop(0,`rgba(220,232,255,${(s.a*0.25).toFixed(3)})`);
      g.addColorStop(1,`rgba(220,232,255,0)`);
      ctx.beginPath(); ctx.arc(s.x,s.y,s.glow,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(240,246,255,${s.a.toFixed(3)})`; ctx.fill();
    }
  }

  window.addEventListener("resize",resize);
  resize(); draw();
})();

// ═══════════════════════════════════════════════════════════
//  NATIVE SCROLL SELECTOR
// ═══════════════════════════════════════════════════════════
(function(){
  const viewport = document.getElementById("orbitViewport");
  const pA       = document.getElementById("planetA");
  const pM       = document.getElementById("planetM");
  const navLeft  = document.getElementById("navLeft");
  const navRight = document.getElementById("navRight");
  const dotA     = document.getElementById("dotA");
  const dotM     = document.getElementById("dotM");
  const cards    = [pA, pM];

  let active = "athletic";

  // Side padding so the first and last card can each reach the scroller's
  // centre. offsetWidth is the LAYOUT width (unaffected by the scale transform),
  // which is what we want here.
  function setPadding(){
    const pad = Math.max(0, (viewport.clientWidth - pA.offsetWidth) / 2);
    viewport.style.paddingLeft  = pad + "px";
    viewport.style.paddingRight = pad + "px";
  }

  // Scroll a card to the horizontal centre of the scroller.
  function centerCard(card, smooth){
    const left = card.offsetLeft + card.offsetWidth / 2 - viewport.clientWidth / 2;
    try {
      viewport.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
    } catch (e) {
      viewport.scrollLeft = left; // very old WebViews: no options object
    }
  }

  // ── Continuous scale/opacity from scroll position ────────────────────────
  // Instead of snapping the size when a card crosses centre, set each card's
  // scale + opacity every frame from how far its centre is from the viewport
  // centre. The card grows smoothly AS it nears the middle and shrinks as it
  // leaves — it tracks the finger, with no hold-then-pop. offsetLeft/offsetWidth
  // are layout values (unaffected by the scale transform), so measuring while
  // scaling is stable and writes no layout — hence no thrash and it stays cheap
  // even on weak hardware.
  const MIN_SCALE = 0.60, MIN_OPACITY = 0.28;
  let scaleRAF = 0;
  function updateScales(){
    scaleRAF = 0;
    const step = Math.abs(pM.offsetLeft - pA.offsetLeft) || 1; // one card + gap
    const vpCenter = viewport.scrollLeft + viewport.clientWidth / 2;
    for(const c of cards){
      const cCenter = c.offsetLeft + c.offsetWidth / 2;
      let d = Math.abs(cCenter - vpCenter) / step; // 0 = centred, 1 = one away
      if(d > 1) d = 1;
      c.style.transform = "scale(" + (1 - (1 - MIN_SCALE)   * d).toFixed(4) + ")";
      c.style.opacity   =            (1 - (1 - MIN_OPACITY) * d).toFixed(4);
    }
  }
  // Coalesce the burst of scroll events into one update per frame.
  function scheduleScales(){ if(!scaleRAF) scaleRAF = requestAnimationFrame(updateScales); }

  // Reflect the centred card in the classes, dots and arrows. Called once per
  // snap by the IntersectionObserver — never per frame.
  function setActive(mode){
    if(mode === active) return;
    active = mode;
    if(mode === "athletic"){
      pA.classList.add("is-active");    pA.classList.remove("is-inactive");
      pM.classList.add("is-inactive");  pM.classList.remove("is-active");
      navLeft.classList.add("hidden");  navRight.classList.remove("hidden");
      dotA.classList.add("active");     dotM.classList.remove("active");
    } else {
      pM.classList.add("is-active");    pM.classList.remove("is-inactive");
      pA.classList.add("is-inactive");  pA.classList.remove("is-active");
      navRight.classList.add("hidden"); navLeft.classList.remove("hidden");
      dotM.classList.add("active");     dotA.classList.remove("active");
    }
  }

  // A thin vertical band down the centre of the scroller. Whichever card
  // overlaps that band is the active one. Works on every WebView that has
  // IntersectionObserver (i.e. effectively all of them on the Play Store).
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting) setActive(en.target.dataset.mode); });
  }, { root: viewport, rootMargin: "0px -50% 0px -50%", threshold: 0 });
  cards.forEach(c => io.observe(c));

  // Strip backdrop-filter / blur AND pause the starfield while the scroller is
  // moving; restore ~140ms after it goes idle. This is what keeps even native
  // scroll smooth on worst-case hardware — blurring a moving background per
  // frame is the expensive part, native scroll or not.
  let idleTimer = null;
  viewport.addEventListener("scroll", ()=>{
    scheduleScales(); // grow/shrink the cards to match the new scroll position
    if(!viewport.classList.contains("is-scrolling")){
      viewport.classList.add("is-scrolling");
      motionActive = true;
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{
      viewport.classList.remove("is-scrolling");
      motionActive = false;
    }, 140);
  }, {passive:true});

  // ── Arrows: scroll the target card to centre; native snap finishes it. ──
  navRight.addEventListener("click", ()=> centerCard(pM, true));
  navLeft .addEventListener("click", ()=> centerCard(pA, true));

  // ── Card taps: active card enters its mode; inactive card scrolls to centre.
  function enter(url){
    document.getElementById("stage").classList.add("out");
    setTimeout(()=>{ location.href = url; }, 380);
  }
  pA.addEventListener("click", ()=>{
    if(active === "athletic") enter("athleticMetronome.html");
    else centerCard(pA, true);
  });
  pM.addEventListener("click", ()=>{
    if(active === "music") enter("musicMetronome.html");
    else centerCard(pM, true);
  });

  // ── Layout on load + on resize/rotation. Re-centre the active card so a
  //    rotation doesn't leave it half-off. ──
  function layout(){
    setPadding();
    centerCard(active === "athletic" ? pA : pM, false);
    updateScales();
  }
  window.addEventListener("resize", layout);

  // Initial paint: pad, then centre Athletic instantly. Two rAFs so the browser
  // has applied the padding before we measure/scroll.
  requestAnimationFrame(()=>{
    setPadding();
    requestAnimationFrame(()=>{
      centerCard(pA, false);
      updateScales(); // set the initial big/small sizes before first paint settles
    });
  });
})();
</script>
</body>
</html>
